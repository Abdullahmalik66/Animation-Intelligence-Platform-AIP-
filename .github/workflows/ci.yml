name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: python -m unittest discover tests -v

      - name: Smoke test (cold start must work)
        run: python scripts/smoke.py

  self-check:
    # The linter must pass its own good-code fixtures.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint the good fixtures (must be clean)
        run: python -m aip check tests/fixtures/good-animations.css

      - name: Lint the bad fixtures (must fail)
        run: |
          if python -m aip check tests/fixtures/bad-animations.jsx; then
            echo "::error::Linter failed to detect known-bad code"
            exit 1
          fi
          echo "Linter correctly rejected known-bad code."
