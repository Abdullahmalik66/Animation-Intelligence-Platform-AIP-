name: Validate Skill Files

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'references/**'
      - '.github/prompts/**'
      - 'adapters/**'

jobs:
  validate:
    name: Validate Skill Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required sections in SKILL.md files
        run: |
          EXIT_CODE=0

          for skill_file in skills/*/SKILL.md; do
            echo "Checking: $skill_file"

            REQUIRED_SECTIONS=(
              "## Goal"
              "## Return Format"
              "## Warnings"
              "## Context Dump"
              "## RTCF"
              "## Few Shot Examples"
            )

            for section in "${REQUIRED_SECTIONS[@]}"; do
              if ! grep -q "$section" "$skill_file"; then
                echo "❌ MISSING: '$section' in $skill_file"
                EXIT_CODE=1
              fi
            done

            # Check for prefers-reduced-motion
            if ! grep -q "prefers-reduced-motion" "$skill_file"; then
              echo "❌ MISSING: prefers-reduced-motion in $skill_file"
              EXIT_CODE=1
            fi

            # Check for cleanup mention
            if ! grep -qE "(cleanup|revert|destroy|cancel|dispose)" "$skill_file"; then
              echo "❌ MISSING: cleanup logic mention in $skill_file"
              EXIT_CODE=1
            fi

            echo "✅ $skill_file"
          done

          exit $EXIT_CODE

      - name: Check AGENTS.md exists
        run: |
          if [ ! -f "AGENTS.md" ]; then
            echo "❌ AGENTS.md is missing"
            exit 1
          fi
          echo "✅ AGENTS.md exists"

      - name: Check copilot-instructions.md exists
        run: |
          if [ ! -f ".github/copilot-instructions.md" ]; then
            echo "❌ .github/copilot-instructions.md is missing"
            exit 1
          fi
          echo "✅ .github/copilot-instructions.md exists"

      - name: Check all prompt files exist
        run: |
          REQUIRED_PROMPTS=(
            ".github/prompts/animation-router.prompt.md"
            ".github/prompts/animate.prompt.md"
            ".github/prompts/fix-animation.prompt.md"
            ".github/prompts/review-animation.prompt.md"
            ".github/prompts/optimize-animation.prompt.md"
            ".github/prompts/migrate-animation.prompt.md"
          )

          EXIT_CODE=0
          for prompt in "${REQUIRED_PROMPTS[@]}"; do
            if [ ! -f "$prompt" ]; then
              echo "❌ MISSING: $prompt"
              EXIT_CODE=1
            else
              echo "✅ $prompt"
            fi
          done

          exit $EXIT_CODE

      - name: Check for TypeScript 'any' in examples
        run: |
          if grep -r ": any" examples/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
            echo "❌ TypeScript 'any' found in examples — use proper types"
            exit 1
          fi
          echo "✅ No TypeScript 'any' in examples"

      - name: Summary
        if: success()
        run: echo "✅ All skill validation checks passed"
